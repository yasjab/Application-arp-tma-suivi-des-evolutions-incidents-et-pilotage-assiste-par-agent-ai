<div class="page-wrapper">

  <!-- Header -->
  <div class="page-header">
    <button class="back-btn" (click)="goBack()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Retour
    </button>
    <div class="header-info">
      <h1 class="page-title">Mon compte</h1>
      <p class="page-subtitle">Gérer vos informations personnelles et votre mot de passe</p>
    </div>
  </div>

  <div class="page-content">

    <!-- Carte profil -->
    <div class="profile-card">
      <div class="avatar">{{ initials }}</div>
      <div class="profile-info">
        <div class="profile-name">{{ user.firstName }} {{ user.name }}</div>
        <div class="profile-login">{{ user.login }}</div>
        <span class="role-badge"
              [class.admin]="user.role === 'ADMIN'"
              [class.user]="user.role === 'USER'">
          {{ user.role }}
        </span>
      </div>
    </div>

    <!-- Informations personnelles -->
    <div class="form-card">
      <div class="form-card-title">
        <svg viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Informations personnelles
      </div>

      <div class="alert alert-error" *ngIf="infosError">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ infosError }}
      </div>

      <div class="alert alert-success" *ngIf="infosSuccess">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        {{ infosSuccess }}
      </div>

      <!-- Bouton reconnexion si login changé -->
      <div class="reconnect-wrapper" *ngIf="showReconnectBtn">
        <button class="btn-reconnect" (click)="reconnect()">
          <svg viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Se reconnecter maintenant
        </button>
      </div>

      <div class="form-grid">

        <div class="field">
          <label class="field-label">Nom <span class="required">*</span></label>
          <input
            class="form-input"
            [(ngModel)]="formName"
            placeholder="ex: Sedrati"
          />
        </div>

        <div class="field">
          <label class="field-label">Prénom <span class="required">*</span></label>
          <input
            class="form-input"
            [(ngModel)]="formFirstName"
            placeholder="ex: Salma"
          />
        </div>

        <div class="field">
          <label class="field-label">Login <span class="required">*</span></label>
          <input
            class="form-input"
            [(ngModel)]="formLogin"
            placeholder="ex: s.sedrati"
          />
        </div>

        <div class="field">
          <label class="field-label">Email <span class="required">*</span></label>
          <input
            class="form-input"
            type="email"
            [(ngModel)]="formEmail"
            placeholder="ex: s.sedrati@maroctelecom.ma"
          />
        </div>

      </div>

      <div class="form-footer">
        <button class="btn-save" (click)="saveInfos()" [disabled]="savingInfos">
          <span class="btn-spinner" *ngIf="savingInfos"></span>
          <svg *ngIf="!savingInfos" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          {{ savingInfos ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>
    </div>

    <!-- Changer mot de passe -->
    <div class="form-card">
      <div class="form-card-title">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Changer le mot de passe
      </div>

      <div class="alert alert-error" *ngIf="passwordError">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ passwordError }}
      </div>

      <div class="alert alert-success" *ngIf="passwordSuccess">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        {{ passwordSuccess }}
      </div>

      <div class="form-grid">

        <div class="field full-width">
          <label class="field-label">Mot de passe actuel <span class="required">*</span></label>
          <input
            class="form-input"
            type="password"
            [(ngModel)]="formCurrentPassword"
            placeholder="••••••••"
          />
        </div>

        <div class="field">
          <label class="field-label">Nouveau mot de passe <span class="required">*</span></label>
          <input
            class="form-input"
            type="password"
            [(ngModel)]="formNewPassword"
            placeholder="min. 6 caractères"
          />
        </div>

        <div class="field">
          <label class="field-label">Confirmer le mot de passe <span class="required">*</span></label>
          <input
            class="form-input"
            type="password"
            [(ngModel)]="formConfirmPassword"
            placeholder="••••••••"
          />
        </div>

      </div>

      <div class="form-footer">
        <button class="btn-save" (click)="savePassword()" [disabled]="savingPassword">
          <span class="btn-spinner" *ngIf="savingPassword"></span>
          <svg *ngIf="!savingPassword" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          {{ savingPassword ? 'Enregistrement...' : 'Changer le mot de passe' }}
        </button>
      </div>
    </div>

  </div>
</div>
